services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    networks:
      - n8n-network
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/obsidian_vault/
      # Replace with your actual ngrok or domain URL
      - WEBHOOK_URL=https://.ngrok-free.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      # Replace the left side with the local path to your Obsidian vault / Markdown files
      - ./path/to/your/local/vault:/data/obsidian_vault

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    networks:
      - n8n-network
    volumes:
      - qdrant_data:/qdrant/storage

networks:
  n8n-network:

volumes:
  n8n_data:
  qdrant_data: